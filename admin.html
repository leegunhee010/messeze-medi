<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
:root{--ink:#191F28;--body:#4E5968;--mut:#8B95A1;--line:#E5E8EB;--bg:#F7F8FA;--co:#3182F6;--co-dk:#1B64DA;--red:#F04452;--green:#03A94D}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}input,select,textarea{font:inherit}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px}

.fld{margin-bottom:14px}.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--body);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #D9DFE7;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:0;border-color:var(--co);box-shadow:0 0 0 3px rgba(49,130,246,.15)}

.side .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin:0 6px 22px}.side .brand i{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--co);border-radius:6px;padding:2px 6px}

.side nav a.on{background:#EAF2FF;color:var(--co-dk)}.side nav a em{font-style:normal;font-size:11.5px;color:var(--mut);background:var(--bg);border-radius:999px;padding:2px 7px}

.main{padding:28px 32px 60px;max-width:1240px}
.main h2{margin:0 0 4px;font-size:22px}.main .sub{margin:0 0 22px;color:var(--mut)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:0 14px 30px -14px rgba(0,0,0,.5);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:50;max-width:420px}

.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:600;color:var(--ink)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;height:70vh}.pv iframe{width:100%;height:100%;border:0}
.post-list .it{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #F2F4F6}.post-list .it b{display:block}.post-list .it small{color:var(--mut)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.tile span{display:block;font-size:12px;color:var(--mut)}.tile b{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:15px}

.sw.sm{width:42px;height:24px}.sw.sm::after{width:18px;height:18px}.sw.sm.on::after{left:21px}
.sw-row{display:flex;gap:14px;align-items:center;cursor:pointer}.sw-row b{display:block;font-size:14.5px}.sw-row small{display:block;color:var(--mut);font-size:12.5px}
.drop{border:2px dashed #D9DFE7;border-radius:14px;background:var(--bg);position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;text-align:center}.drop.over{border-color:var(--co);background:#EAF2FF}.drop img{max-width:100%;max-height:100%;display:block;object-fit:contain}.drop .hint{position:absolute;left:0;right:0;bottom:0;background:rgba(25,31,40,.72);color:#fff;font-size:12px;padding:7px 10px;line-height:1.4}.drop input{display:none}.drop:hover .hint{background:var(--co)}

.help{font-size:12px;color:var(--co);font-weight:600;margin-left:6px}.prog{margin:12px 0 0;color:var(--co-dk);font-size:13px;min-height:18px}
@media(max-width:1000px){.tiles{grid-template-columns:1fr 1fr}.seo-grid,.three,.edit-pane{grid-template-columns:1fr}}
.inq-tbl td{font-size:13px}.inq-tbl .st{font-weight:600}.inq-tbl .memo{min-width:180px}
</style>
</head>

/* ---------- GitHub ---------- */
const GH='https://api.github.com/repos/'+REPO+'/contents/';
const gh=(m,p,b)=>fetch(GH+p+(m==='GET'?'?ref='+BR+'&t='+Date.now():''),{method:m,headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
async function ghGet(path){const r=await gh('GET',path);if(r.status===404)return null;if(!r.ok)throw new Error('GitHub 읽기 실패 ('+r.status+')');const j=await r.json();return {sha:j.sha,text:b64dec(j.content)}}
async function ghPutRaw(path,contentB64,msg,sha){const body={message:msg,content:contentB64,branch:BR};if(sha)body.sha=sha;let r=await gh('PUT',path,body);
  if(r.status===409||r.status===422){const cur=await ghGet(path);if(cur)body.sha=cur.sha;r=await gh('PUT',path,body)}
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||('저장 실패 '+r.status))}return r.json()}
async function ghPut(path,text,msg){const cur=await ghGet(path);return ghPutRaw(path,b64enc(text),msg,cur&&cur.sha)}
async function ghDel(path,msg){const cur=await ghGet(path);if(!cur)return;const r=await gh('DELETE',path,{message:msg,sha:cur.sha,branch:BR});if(!r.ok)throw new Error('삭제 실패 '+r.status)}
async function ghJson(path,fallback){const c=await ghGet(path);if(!c)return fallback;try{return JSON.parse(c.text)}catch(e){return fallback}}

/* ---------- gate ---------- */
const ENC={"salt": "nHyOBIBMx/s54oSV+52XfQ==", "iv": "7bWUPSXTXnaIYA74", "ct": "Gv/I6YPrnf4oNvizvCyfT4dBX8UdcF39fDB7rg/qNrqkJRbCJA2i/DvLfyMATL3zuZ594FlbhpQ="}; // {salt,iv,ct} base64 — 아이디+비밀번호로만 풀리는 GitHub 토큰
const te=new TextEncoder(), b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function deriveKey(id,pw,salt){const base=await crypto.subtle.importKey('raw',te.encode(id.trim().toLowerCase()+'␀'+pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
async function mdmEncrypt(id,pw,tok){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const base=await crypto.subtle.importKey('raw',te.encode(id.trim().toLowerCase()+'␀'+pw),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(tok)));const a2b=u=>btoa(String.fromCharCode.apply(null,u));return {salt:a2b(salt),iv:a2b(iv),ct:a2b(ct)}}
async function unlock(id,pw){const k=await deriveKey(id,pw,b2a(ENC.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(ENC.iv)},k,b2a(ENC.ct));return new TextDecoder().decode(pt)}
async function enter(){const id=$('#gId').value,pw=$('#gPw').value;if(!id||!pw){$('#gMsg').textContent='아이디와 비밀번호를 입력해 주세요.';return}
  $('#gBtn').disabled=true;$('#gMsg').textContent='';
  try{const t=await unlock(id,pw);localStorage.setItem(TOK_LS,t);const r=await gh('GET','data/regions.json');if(r.status===401||r.status===403)throw new Error('토큰 권한 오류. 관리자에게 문의하세요.');boot()}
  catch(e){localStorage.removeItem(TOK_LS);$('#gMsg').textContent=/OperationError|decrypt/i.test(String(e))||e.name==='OperationError'?'아이디 또는 비밀번호가 올바르지 않습니다.':e.message}
  $('#gBtn').disabled=false}
$('#gBtn').onclick=enter;['#gId','#gPw'].forEach(q=>$(q).addEventListener('keydown',e=>{if(e.key==='Enter')enter()}));
$('#logout').onclick=e=>{e.preventDefault();localStorage.removeItem(TOK_LS);location.reload()};

/* ---------- inquiries ---------- */
const INQ_FILE='data/inquiries.json', ST=['신규','연락중','견적 발송','계약','보류'], WF='sync-inquiries.yml';
const STC={'신규':'#3182F6','연락중':'#F59E0B','견적 발송':'#8B5CF6','계약':'#03A94D','보류':'#8B95A1'};
const ghApi=(m,p,b)=>fetch('https://api.github.com/repos/'+REPO+p,{method:m,headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
async function loadInq(){const j=await ghJson(INQ_FILE,null);S.inqMeta=j||null;S.inq=j?(j.rows||[]):null;updateSide()}
async function inqConnected(){try{const r=await ghApi('GET','/actions/secrets?per_page=100');if(!r.ok)return null;const j=await r.json();const n=(j.secrets||[]).map(s=>s.name);return n.includes('MESSEZE_ADMIN_ID')&&n.includes('MESSEZE_ADMIN_PW')}catch(e){return null}}
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('암호화 모듈을 불러오지 못했습니다.'));document.head.appendChild(s)});
async function loadSodium(){if(!window.sodium||!window.sodium.ready){await loadScript('https://cdn.jsdelivr.net/npm/libsodium@0.7.15/dist/modules/libsodium.js');await loadScript('https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.15/dist/modules/libsodium-wrappers.js')}if(!window.sodium||!window.sodium.ready)throw new Error('암호화 모듈 초기화 실패');await window.sodium.ready;return window.sodium}
async function setSecret(name,value){const sod=await loadSodium();const kr=await ghApi('GET','/actions/secrets/public-key');if(!kr.ok)throw new Error(kr.status===403?'이 GitHub 토큰에는 시크릿 설정 권한이 없습니다. (repo 권한 필요)':'공개키 조회 실패 ('+kr.status+')');const k=await kr.json();
  const enc=sod.crypto_box_seal(sod.from_string(value),sod.from_base64(k.key,sod.base64_variants.ORIGINAL));const r=await ghApi('PUT','/actions/secrets/'+name,{encrypted_value:sod.to_base64(enc,sod.base64_variants.ORIGINAL),key_id:k.key_id});if(!r.ok&&r.status!==201&&r.status!==204)throw new Error('시크릿 저장 실패 ('+r.status+')')}
async function runSync(progress){const d=await ghApi('POST','/actions/workflows/'+WF+'/dispatches',{ref:BR});if(d.status!==204){if(d.status===404)throw new Error('동기화 작업(workflow)을 찾을 수 없습니다. 레포에 Actions가 켜져 있는지 확인하세요.');throw new Error('동기화 실행 실패 ('+d.status+')')}
  const t0=Date.now();let run=null;await new Promise(r=>setTimeout(r,4000));
  while(Date.now()-t0<150000){const r=await ghApi('GET','/actions/workflows/'+WF+'/runs?per_page=1&event=workflow_dispatch&t='+Date.now());const j=await r.json().catch(()=>({}));const w=(j.workflow_runs||[])[0];if(w&&new Date(w.created_at).getTime()>t0-15000){run=w;if(w.status==='completed')break;if(progress)progress(w.status==='queued'?'대기 중…':'본사 접수함 읽는 중…')}else if(progress)progress('동기화 시작 중…');await new Promise(r=>setTimeout(r,3000))}
  if(!run)throw new Error('동기화가 시작되지 않았습니다. 잠시 후 다시 시도하세요.');await new Promise(r=>setTimeout(r,1500));await loadInq();if(run.conclusion!=='success'){const e=S.inqMeta&&S.inqMeta.error;throw new Error(e||'동기화 실패. 본사 계정 정보를 확인하세요.')}return run}
const rel=iso=>{if(!iso)return '아직 없음';const m=Math.round((Date.now()-new Date(iso).getTime())/60000);if(m<1)return '방금';if(m<60)return m+'분 전';if(m<1440)return Math.floor(m/60)+'시간 전';return new Date(iso).toLocaleString('ko-KR')};
const fmtTs=s=>{s=String(s||'');const d=new Date(s.replace(' ','T'));return isNaN(d)?s.slice(0,16):d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})};
let inqShowConn=false;

    +(rows.length?'<table class="inq-tbl"><thead><tr><th style="width:110px">접수</th><th>이름</th><th>병원</th><th>연락처</th><th>홈페이지</th><th style="width:120px">상태</th><th>메모</th><th style="width:70px"></th></tr></thead><tbody>'+rows.map(x=>'<tr data-row="'+esc(x.row)+'"><td>'+esc(fmtTs(x.ts))+'</td><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.hospital)+'</td><td><a href="tel:'+esc(x.phone)+'" style="color:var(--co);font-weight:600">'+esc(x.phone)+'</a></td><td style="max-width:200px;word-break:break-all">'+(x.site?'<a href="'+esc(/^https?:/.test(x.site)?x.site:'https://'+x.site)+'" target="_blank" style="color:var(--body)">'+esc(x.site)+'</a>':'<span style="color:var(--mut)">-</span>')+'</td><td><select class="st" style="border-left:4px solid '+(STC[x.status]||'#ccc')+'">'+ST.map(s=>'<option'+(s===(x.status||'신규')?' selected':'')+'>'+s+'</option>').join('')+'</select>'+(x.dirty?'<div class="len" style="margin-top:3px">본사 반영 대기</div>':'')+'</td><td><input class="memo" value="'+esc(x.memo||'')+'" placeholder="통화 내용, 다음 일정…"></td><td><button class="btn sm gh">저장</button></td></tr>').join('')+'</tbody></table>'
    :'<p style="color:var(--mut);margin:8px 0">아직 접수된 병원 문의가 없습니다. 사이트에서 신청이 들어오면 여기에 쌓입니다.</p>')+'</div>'}
  w.innerHTML=html;bindConn();

function loadFrame(){const f=$('#cpFrame');f.src=cpPage+'?edit=1&t='+Date.now();f.onload=()=>{const d=f.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent='[data-copy]{outline:2px dashed rgba(49,130,246,.55);outline-offset:3px;cursor:text;min-width:1em}[data-copy]:hover{outline-color:#3182F6;background:rgba(49,130,246,.08)}[data-copy]:focus{outline:2px solid #3182F6;background:rgba(49,130,246,.1)}.rv{opacity:1!important;transform:none!important}.md-ps-track,.md-kw-track{animation-play-state:paused!important}.nav,.kko-chat,#ch-plugin,[class*="kko"]{pointer-events:none}';d.head.appendChild(st);

async function saveCopy(){if(!Object.keys(cpChanged).length){say('바뀐 문구가 없습니다.');return}const b=$('#cpSave');b.disabled=true;try{Object.assign(S.copy,cpChanged);await ghPut('data/medi-copy.json',JSON.stringify(S.copy,null,2),'문구 수정: '+Object.keys(cpChanged).join(', '));cpChanged={};drawChanges();drawSaved();say('저장했습니다. 1~2분 뒤 사이트에 반영됩니다.')}catch(e){say(e.message,true)}b.disabled=false}

function drawEditor(){const d=today();const slug='post-'+d.replace(/-/g,'')+'-'+String(Date.now()).slice(-4);$('#bEditor').innerHTML=`<div class="card"><b style="font-size:16px">새 글</b>
<div class="two" style="margin-top:14px"><div class="fld"><label>제목</label><input id="pTitle" placeholder="질문형 제목이 좋습니다. 예: 병원 홈페이지에 꼭 있어야 하는 페이지는?"></div><div class="fld"><label>분류</label><select id="pCat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
<div class="fld"><label>요약 (목록·검색에 보이는 두 문장)</label><textarea id="pDesc" rows="2"></textarea></div>
<div class="two"><div class="fld"><label>날짜</label><input id="pDate" value="${d}"></div><div class="fld"><label>주소 (영문, 바꾸지 않아도 됩니다)</label><input id="pSlug" value="${slug}"></div></div>
<div class="two"><div class="fld"><label>표지 이미지</label><input id="pFile" type="file" accept="image/*"><small>없으면 병원 🏥 그림이 들어갑니다. 2MB 이하 권장</small></div><div class="fld"><label>표지 이미지 주소 (파일 대신)</label><input id="pPhoto" placeholder="https://…"></div></div>
<div class="fld"><label>본문</label><div class="ed-tb"><button data-c="formatBlock" data-a="H2">소제목</button><button data-c="formatBlock" data-a="P">본문</button><button data-c="bold"><b>굵게</b></button><button data-c="insertUnorderedList">목록</button><button data-c="table">표 넣기</button><button data-c="quote">강조 문장</button><button data-c="html" id="pHtmlBtn" style="margin-left:auto;border-color:var(--ink)">&lt;/&gt; HTML 직접 입력</button></div><div class="editor" id="pBody" contenteditable="true"><p>여기에 본문을 쓰세요. 소제목은 2~4개, 표나 강조 문장을 하나쯤 넣으면 읽기 좋습니다.</p></div><textarea id="pBodyHtml" class="editor" style="display:none;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre;resize:vertical" spellcheck="false"></textarea><small id="pHtmlHint" style="display:none;color:var(--mut)">HTML 그대로 저장됩니다. &lt;h2&gt;, &lt;p&gt;, &lt;ul&gt;, &lt;table&gt;, &lt;blockquote&gt;, &lt;img&gt;, &lt;a&gt; 등 자유롭게 쓸 수 있습니다.</small></div>

<div class="row"><button class="btn gh" id="pPrev">미리보기</button><button class="btn co" id="pPub">발행</button><span id="pMsg" style="color:var(--mut);font-size:13px"></span></div></div><div class="pv" id="pPv" style="display:none;margin-top:12px"><iframe id="pPvF"></iframe></div>`;
  let htmlMode=false;
  const pretty=h=>h.replace(/<\/(p|h2|h3|ul|ol|li|table|thead|tbody|tr|blockquote|div)>/g,'</$1>\n').replace(/<(ul|ol|table|thead|tbody|tr)>/g,'<$1>\n').trim();
  function setHtmlMode(on){htmlMode=on;const ed=$('#pBody'),ta=$('#pBodyHtml');if(on){ta.value=pretty(ed.innerHTML);ed.style.display='none';ta.style.display='block';ta.style.minHeight='320px'}else{ed.innerHTML=ta.value;ta.style.display='none';ed.style.display='block'}$('#pHtmlHint').style.display=on?'block':'none';$('#pHtmlBtn').textContent=on?'편집기로 돌아가기':'</> HTML 직접 입력';document.querySelectorAll('.ed-tb button:not(#pHtmlBtn)').forEach(x=>x.disabled=on)}
  window.mdmSetHtmlMode=setHtmlMode;
  document.querySelectorAll('.ed-tb button').forEach(b=>b.onclick=e=>{e.preventDefault();const c=b.dataset.c;if(c==='html'){setHtmlMode(!htmlMode);return}$('#pBody').focus();if(c==='table')document.execCommand('insertHTML',false,'<div class="tbl"><table><thead><tr><th>항목</th><th>내용</th></tr></thead><tbody><tr><td>예시</td><td>내용을 적으세요</td></tr><tr><td>예시</td><td>내용을 적으세요</td></tr></tbody></table></div><p></p>');else if(c==='quote')document.execCommand('insertHTML',false,'<blockquote>핵심 문장을 적으세요.</blockquote><p></p>');else document.execCommand(c,false,b.dataset.a||null)});
  const faqBox=$('#pFaq');
  function addFaq(q,a){if(faqBox.children.length>=5)return;const n=faqBox.children.length+1;const d=document.createElement('div');d.className='fld';d.innerHTML=`<label style="display:flex;justify-content:space-between"><span>질문 ${n}</span><a href="#" class="fq-del" style="color:var(--red);font-weight:600">삭제</a></label><input class="fq-q" placeholder="질문" value="${esc(q||'')}"><textarea class="fq-a" rows="2" placeholder="답변" style="margin-top:6px">${esc(a||'')}</textarea>`;d.querySelector('.fq-del').onclick=e=>{e.preventDefault();d.remove();renum()};faqBox.appendChild(d);renum()}

  addFaq();addFaq();$('#pFaqAdd').onclick=()=>addFaq();
  $('#pPrev').onclick=async()=>{try{const p=collectPost();const html=await buildPostHtml(p,true);$('#pPv').style.display='block';$('#pPvF').srcdoc=html.replace(/(href|src)="\.\.\/\.\.\//g,'$1="'+location.origin+location.pathname.replace(/admin\.html$/,'')).replace(/(href|src)="\.\.\//g,'$1="'+location.origin+location.pathname.replace(/admin\.html$/,'')+'blog/')}catch(e){say(e.message,true)}};
  $('#pPub').onclick=publishPost;$('#bEditor').scrollIntoView({behavior:'smooth'})}
function collectPost(){const g=id=>$('#'+id).value.trim();const title=g('pTitle'),desc=g('pDesc');if(!title)throw new Error('제목을 입력해 주세요.');if(!desc)throw new Error('요약을 입력해 주세요.');
  const slug=g('pSlug').replace(/[^a-z0-9-]/gi,'-').toLowerCase();if(!slug)throw new Error('주소는 영문·숫자·하이픈만 쓸 수 있습니다.');
  const ta=$('#pBodyHtml');let body=(ta&&ta.style.display!=='none')?ta.value.trim():$('#pBody').innerHTML.replace(/<div>/g,'<p>').replace(/<\/div>/g,'</p>').replace(/ style="[^"]*"/g,'').replace(/<br>\s*<\/p>/g,'</p>');
  if(!body.replace(/<[^>]+>/g,'').trim())throw new Error('본문을 입력해 주세요.');
  const faq=[...document.querySelectorAll('#pFaq .fld')].map(d=>({q:d.querySelector('.fq-q').value.trim(),a:d.querySelector('.fq-a').value.trim()})).filter(x=>x.q&&x.a).slice(0,5);
  return {slug,cat:g('pCat'),title,desc,date:g('pDate')||today(),grad:GRADS[S.posts.length%GRADS.length],body,faq,photo:g('pPhoto')||'',file:$('#pFile').files[0]||null}}
const rootPhoto=p=>String(p||'').replace(/^(\.\.\/)+/,'');
function coverTag(photo,pre){const r=rootPhoto(photo)||'assets/medi/emoji-hospital-lg.png';const emo=/emoji-/.test(r);const src=/^https?:/.test(r)?r:pre+r;return `<img class="cover${emo?' emo':''}" src="${esc(src)}" alt="" loading="lazy"${/^https?:/.test(r)?' referrerpolicy="no-referrer"':''}>`}
let TPL=null;
async function buildPostHtml(p,preview){if(!TPL){const t=await (await fetch('blog/posts/_tpl.html?t='+Date.now())).text();TPL=t}
  const others=S.posts.filter(x=>x.slug!==p.slug).slice(0,2);const url=SITE+'/blog/posts/'+p.slug+'.html';
  const faqHtml=p.faq.length?'<h2>자주 묻는 질문</h2>'+p.faq.map(f=>`<h3>Q. ${esc(f.q)}</h3><p>${esc(f.a)}</p>`).join(''):'';
  const rel=others.map(o=>`<a class="rcard" href="${esc(o.slug)}.html"><div class="thumb" style="background:${o.grad}"><span class="pat"></span>${coverTag(o.photo,'../../')}</div>\n<div class="b"><span class="cat">${esc(o.cat)}</span><h4>${esc(o.title)}</h4></div></a>`).join('');
  const ld={'@context':'https://schema.org','@graph':[{'@type':'BlogPosting','@id':url+'#article','headline':p.title,'description':p.desc,'datePublished':p.date,'dateModified':p.date,'inLanguage':'ko','mainEntityOfPage':url,'author':{'@type':'Organization','name':'메세지AI 메디 편집팀'},'publisher':{'@id':'https://messeze.com/#organization'},'isPartOf':{'@id':SITE+'/#website'}},
    {'@type':'FAQPage','@id':url+'#faq','mainEntity':p.faq.map(f=>({'@type':'Question','name':f.q,'acceptedAnswer':{'@type':'Answer','text':f.a}}))},
    {'@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'홈','item':SITE+'/'},{'@type':'ListItem','position':2,'name':'블로그','item':SITE+'/blog/index.html'},{'@type':'ListItem','position':3,'name':p.title,'item':url}]}]};
  return TPL.replace(/\{\{TITLE\}\}/g,esc(p.title)).replace(/\{\{DESC\}\}/g,esc(p.desc)).replace(/\{\{SLUG\}\}/g,p.slug).replace(/\{\{CAT\}\}/g,esc(p.cat)).replace(/\{\{DATE\}\}/g,p.date).replace(/\{\{GRAD\}\}/g,p.grad)
    .replace('{{COVER}}',coverTag(p.photo,'../../')).replace('{{BODY}}',p.body).replace('{{FAQ}}',faqHtml).replace('{{ABOUT}}',ABOUT).replace('{{REL}}',rel).replace('{{LD}}','<script type="application/ld+json">'+JSON.stringify(ld)+'<\/script>').replace('{{NOINDEX}}',preview?'<meta name="robots" content="noindex">':'')}
async function publishPost(){const b=$('#pPub');b.disabled=true;const m=$('#pMsg');try{const p=collectPost();if(S.posts.some(x=>x.slug===p.slug))throw new Error('같은 주소의 글이 이미 있습니다. 주소를 바꿔 주세요.');
    if(p.file){m.textContent='표지 업로드 중…';const ext=(p.file.name.split('.').pop()||'jpg').toLowerCase().replace('jpeg','jpg');const b64=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=no;fr.readAsDataURL(p.file)});const path='assets/medi/blog/'+p.slug+'.'+ext;await ghPutRaw(path,b64,'블로그 표지: '+p.slug);p.photo=path}
    m.textContent='글 페이지 만드는 중…';const html=await buildPostHtml(p,false);await ghPut('blog/posts/'+p.slug+'.html',html,'블로그 글: '+p.title);
    m.textContent='목록 갱신 중…';const entry={slug:p.slug,cat:p.cat,title:p.title,desc:p.desc,date:p.date,grad:p.grad,body:'',photo:rootPhoto(p.photo),faq:p.faq};S.posts.unshift(entry);await syncBlogIndex('블로그 목록 갱신: '+p.title);
    m.textContent='';say('발행했습니다. 1~2분 뒤 사이트에 보입니다.');vBlog()}catch(e){m.textContent='';say(e.message,true)}b.disabled=false}
async function syncBlogIndex(msg){await ghPut('data/posts.json',JSON.stringify(S.posts,null,2),msg);
  const idx=await ghGet('blog/index.html');const arr=S.posts.map(p=>({slug:p.slug,cat:p.cat,title:p.title,desc:p.desc,date:p.date,grad:p.grad,cover:coverTag(p.photo,'../')}));

function bindDrop(dropQ,fileQ,onFile){const d=$(dropQ),f=$(fileQ);f.onchange=()=>{if(f.files[0])onFile(f.files[0]);f.value=''};['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over')}));d.addEventListener('drop',e=>{const x=e.dataTransfer.files[0];if(x)onFile(x)})}
async function loadPageTable(){const pages=SEO_PAGES();const rows=await Promise.all(pages.map(async([p,name])=>{try{const cur=await ghGet(p);if(!cur)return null;const v=parseSeo(cur.text);seoMeta[p]={v,sha:cur.sha};return [p,name,v]}catch(e){return null}}));
  const tb=$('#pgRows');if(!tb)return;tb.innerHTML=rows.filter(Boolean).map(([p,name,v])=>{const tl=v.title.length,dl=v.desc.length;return '<tr data-p="'+esc(p)+'"><td><b>'+esc(name)+'</b><div class="len" style="word-break:break-all">/'+esc(p==='index.html'?'':p)+'</div></td><td>'+esc(v.title)+'<div class="len'+(tl<30||tl>60?' bad':'')+'">'+tl+'자</div></td><td>'+(v.desc?esc(v.desc):'<span style="color:var(--red)">설명 없음</span>')+'<div class="len'+(dl<80||dl>160?' bad':'')+'">'+dl+'자</div></td><td>'+(v.noindex?'<span class="badge no">검색 제외</span>':'<span class="badge">노출</span>')+'</td><td><button class="btn gh sm" data-edit="'+esc(p)+'">편집</button></td></tr>'}).join('');
  tb.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openPageEdit(b.dataset.edit))}
function openPageEdit(p){seoPage=p;const name=(SEO_PAGES().find(x=>x[0]===p)||[])[1]||p;const v=seoMeta[p].v;const f=$('#pgEdit');const og=(v.og||S.seo.ogImage||SITE+'/assets/og.png').replace(SITE+'/','');
  f.innerHTML='<div class="edit-pane"><div><div class="row" style="justify-content:space-between;margin-bottom:12px"><b style="font-size:15px">'+esc(name)+' 편집</b><a class="help" href="'+esc(pageUrl(p))+'" target="_blank">페이지 열기 ↗</a></div>'
+'<div class="fld"><label>제목 (title) <span class="len" id="tLen"></span></label><input id="pTi" value="'+esc(v.title)+'"><small>핵심 키워드를 앞에, 브랜드는 뒤에. 예) 병원 홈페이지 제작ㅣ메세지AI 메디</small></div>'
+'<div class="fld"><label>설명 (description) <span class="len" id="dLen"></span></label><textarea id="pDe" rows="3">'+esc(v.desc)+'</textarea><small>검색 결과 제목 밑에 나오는 문장. 무엇을·누구에게·어떻게가 한 번에 읽히게</small></div>'
+'<div class="two"><div class="fld"><label>키워드 (쉼표로 구분)</label><input id="pKw" value="'+esc(v.kw)+'"></div><div class="fld"><label>이 페이지만 다른 공유 이미지 (선택)</label><input id="pOg" value="'+esc(v.og)+'" placeholder="비우면 사이트 공통 이미지"></div></div>'
+'<label class="sw-row" style="margin:4px 0 16px"><button type="button" class="sw sm'+(v.noindex?' on':'')+'" id="pNo"></button><span><b>검색 결과에서 제외 (noindex)</b><small>본사 사이트와 겹치는 페이지처럼 검색에 안 나와야 할 때만 켭니다.</small></span></label>'
+'<div class="row"><button class="btn co" id="pgSave">이 페이지 저장</button><button class="btn gh" id="pgClose">닫기</button></div></div>'
+'<div><small class="lbl">구글 검색 결과</small><div class="serp"><div class="u"><img src="'+esc(S.seo.favicon||'assets/favicon.png')+'" alt="" onerror="this.style.visibility=\'hidden\'"><span>medi.messeze.com<br><span style="color:var(--mut)" id="pvU"></span></span></div><div class="t" id="pvT"></div><div class="d" id="pvD"></div></div>'
+'<small class="lbl" style="margin-top:16px">카카오톡 공유</small><div class="kakao"><img id="pvK" src="'+esc(og)+'" alt="" onerror="this.style.visibility=\'hidden\'"><div class="kb"><b id="pvKT"></b><p id="pvKD"></p><small>medi.messeze.com</small></div></div></div></div>';
  const no=$('#pNo');no.onclick=()=>no.classList.toggle('on');
  const upd=()=>{const t=$('#pTi').value,d=$('#pDe').value;const L=(q,n,a,b)=>{const el=$(q);el.textContent=n+'자';el.className='len'+(n<a||n>b?' bad':'')};L('#tLen',t.length,30,60);L('#dLen',d.length,80,160);$('#pvT').textContent=t||'(제목 없음)';$('#pvU').textContent=pageUrl(p);$('#pvD').textContent=d||'(설명 없음)';$('#pvKT').textContent=t;$('#pvKD').textContent=d;const o=$('#pOg').value.trim();$('#pvK').src=(o||S.seo.ogImage||SITE+'/assets/og.png').replace(SITE+'/','')};
  ['#pTi','#pDe','#pOg'].forEach(q=>$(q).addEventListener('input',upd));upd();f.scrollIntoView({behavior:'smooth',block:'start'});
  $('#pgClose').onclick=()=>{f.innerHTML='';seoPage=null};
  $('#pgSave').onclick=async e=>{const b=e.target;b.disabled=true;try{const nv={title:$('#pTi').value.trim(),desc:$('#pDe').value.trim(),kw:$('#pKw').value.trim(),og:$('#pOg').value.trim(),noindex:no.classList.contains('on')};if(!nv.title)throw new Error('제목을 입력해 주세요.');
    const cur=await ghGet(p);const h=applyPageSeo(cur.text,nv);await ghPutRaw(p,b64enc(h),'SEO: '+p,cur.sha);say('저장했습니다. 1~2분 뒤 반영됩니다.');f.innerHTML='';await loadPageTable()}catch(x){say(x.message,true)}b.disabled=false}}

/* ---------- start ---------- */
if(tok()){boot()}
</script>
</body>
</html>
